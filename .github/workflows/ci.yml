name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Cache project-local QEMU (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .tools/downloads
          key: qemu-win-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: Install QEMU into .tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          scripts/bootstrap.sh qemu
          echo "QEMU_UI_QEMU_DIR=$PWD/.tools/qemu" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Generated TypeScript types are up to date
        shell: bash
        run: git diff --exit-code -- web/src/api/generated

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
