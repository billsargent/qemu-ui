[package]
name = "qemu-ui-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
des = "0.8"
qemu-ui-winsec = { path = "../qemu-ui-winsec" }
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
qemu-ui-core = { version = "0.1.0", path = "../qemu-ui-core" }
qemu-ui-qmp = { version = "0.1.0", path = "../qemu-ui-qmp" }
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
png = "0.18"
sha2 = "0.11.1"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
url = "2.5.8"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
x509-parser = "0.18.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
time = { version = "0.3.55", features = ["std"] }
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "qemu-uid"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"

[target."cfg(windows)".dependencies]
uds_windows = "1.2.1"
windows-service = "0.8.1"
