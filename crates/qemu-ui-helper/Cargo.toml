[package]
name = "qemu-ui-helper"
description = "Privileged helper for qemu-ui: a closed set of audited operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "qemu-ui-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
qemu-ui-core = { version = "0.1.0", path = "../qemu-ui-core" }
qemu-ui-qmp = { version = "0.1.0", path = "../qemu-ui-qmp" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
uds_windows = "1.2.1"
